name: build engine + deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # The engine the bots were trained on: royalesim 0.1.22 (RoyaleSim commit f042db0).
  ROYALESIM_REF: f042db0797dd869d2fb15ad805afc1b25aec7610
  PYODIDE_VERSION: "0.27.7"

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - name: Cache the built engine wheel
        id: cache
        uses: actions/cache@v4
        with:
          path: wheelhouse
          key: royalesim-${{ env.ROYALESIM_REF }}-pyodide-${{ env.PYODIDE_VERSION }}-v1

      - name: Checkout RoyaleSim
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: RoyaleGym/RoyaleSim
          ref: ${{ env.ROYALESIM_REF }}
          path: RoyaleSim
          fetch-depth: 0

      - uses: actions/setup-python@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          python-version: "3.12"

      # Today's nightly emits wasm features (bulk-memory-opt, call-indirect-overlong...) that the
      # wasm-opt of Emscripten 3.1.58 (Pyodide 0.27) rejects. Use the toolchain Pyodide pins for itself.
      - name: Rust toolchain Pyodide ${{ env.PYODIDE_VERSION }} pins
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install "pyodide-build<0.30"
          pyodide xbuildenv install ${{ env.PYODIDE_VERSION }}
          TC=$(pyodide config get rust_toolchain)
          echo "Pyodide rust_toolchain: $TC"
          rustup toolchain install "$TC" --profile minimal
          rustup default "$TC"
          rustup target add wasm32-unknown-emscripten --toolchain "$TC"
          echo "RUSTUP_TOOLCHAIN=$TC" >> "$GITHUB_ENV"
          rustc --version

      # The same data staging as RoyaleSim's own wheels.yml: the crate include_str!s these files.
      - name: Generate and stage the engine data files
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: RoyaleSim
        run: |
          python -m pip install numpy msgspec
          python tools/extract_arena.py
          python tools/extract_cards.py --vintage 2018
          cp data/derived/cards-15.535.json data/derived/cards.json
          python tools/extract_globals.py
          python tools/stage_wheel_data.py

      - name: Build the Pyodide wheel (cibuildwheel)
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: RoyaleSim
        env:
          CIBW_PLATFORM: pyodide
          CIBW_BUILD: cp312-pyodide_wasm32
          CIBW_PYODIDE_VERSION: ${{ env.PYODIDE_VERSION }}
          CIBW_TEST_SKIP: "*"
          # A wheel runs only its compiled-in card table (the crate's own note on checkout-data).
          CIBW_ENVIRONMENT: MATURIN_PEP517_ARGS="--no-default-features" RUSTUP_TOOLCHAIN="${{ env.RUSTUP_TOOLCHAIN }}"
        run: |
          pip install "cibuildwheel>=2.23,<4"
          cibuildwheel --output-dir ../wheelhouse
          ls -la ../wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: engine-wheel
          path: wheelhouse/*.whl

  site:
    needs: engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: engine-wheel
          path: site/wheels
      - name: Index the wheels the worker installs
        run: |
          cd site/wheels && ls *.whl > index.txt && cat index.txt
          cd .. && ls -laR | head -60
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
